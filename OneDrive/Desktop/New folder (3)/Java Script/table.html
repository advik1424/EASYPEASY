<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

   <h2>Multiplication Table</h2>

    <script>

        let n = (prompt("Enter a number:"));

        document.write("<h3>Table of " + n + "</h3>");

        for (let i = 1; i <= 10; i++) {

            document.write(n + " × " + i + " = " + (n * i) + "<br>");

        }

    </script>
    
</body>
</html>
