<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="demo"></div>

    <script>

        for(let i = 1; i <= 10; i++) {
            document.write("<br>ABES ENGINEERING COLLEGE");
        }

        const car = ["2", "4", "3", "2", "3", "4", "5", "7"];

        let text = "";

        for(let j = 0; j < car.length; j++) {
            text += car[j] + "<br>";
        }

        document.getElementById("demo").innerHTML = text;

    </script>

</body>

</body>
